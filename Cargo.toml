[package]
name = "hecate-lampad-core"
description = "Shared agent logic for Hecate lampad agents"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Gaultier HUBERT"]
build = "build.rs"

[dependencies]
hecate-protocol = { git = "https://github.com/codebfu/hecate.git", rev = "14d626dca14b08e6e65be5c6139f63beafdd9f33", package = "hecate-protocol" }
hecate-lampad-helper-base = { git = "https://github.com/codebfu/hecate-lampad-helper-base.git", rev = "9e401cb7f29ccdab070e5c488aa919dad729f7c2" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
toml = "0.8"
rand = "0.8"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "sign-release"
path = "src/bin/sign-release.rs"

[dev-dependencies]
tempfile = "3"
proptest = "1"
